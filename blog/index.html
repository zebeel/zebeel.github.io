<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Memories</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>My Memories</h1>
            <p>瞬間を刻む</p>
        </div>

        <div class="posts-container" id="posts-container">
            <!-- Posts will be generated here by JavaScript -->
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <div class="lightbox-content" onclick="event.stopPropagation()">
            <button class="lightbox-close" onclick="closeLightbox()">&times;</button>
            <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox('prev')">&larr;</button>
            <img id="lightbox-image" class="lightbox-image" src="" alt="Full size image">
            <button class="lightbox-nav lightbox-next" onclick="navigateLightbox('next')">&rarr;</button>
            <div id="lightbox-counter" class="lightbox-counter"></div>
        </div>
    </div>

    <script src="assets/js/data.js"></script>
    <script src="assets/js/script.js"></script>
</body>
</html>
