<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE VAN CHUONG</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: #e1e1e1;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
        }

        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .language-switcher {
            display: flex;
            gap: 10px;
        }

        .theme-toggle {
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid #00d4ff;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .theme-toggle:hover {
            background: #00d4ff;
            transform: translateY(-2px) rotate(180deg);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .lang-btn {
            padding: 2px 10px;
            background: rgba(26, 26, 46, 0.9);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .lang-btn:hover {
            background: #00d4ff;
            color: #0f0f23;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .lang-btn.active {
            background: #00d4ff;
            color: #0f0f23;
        }

        #skills-content {
            display: ruby;
        }

        .skill-tag {
            margin-bottom: 2px;
            padding: 2px 10px;
            background: rgba(26, 26, 46, 0.9);
            color: #00d4ff;
            border: 1px solid #00d4ff;
            border-radius: 10px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .skill-tag:hover {
            background: #00d4ff;
            color: #0f0f23;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 212, 255, 0.3);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .cv-card {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 212, 255, 0.2);
            overflow: hidden;
            opacity: 0;
            transform: translateY(30px);
            animation: slideIn 0.8s ease-out forwards;
        }

        @keyframes slideIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            background: linear-gradient(135deg, #0f0f23, #1a1a2e);
            color: #e1e1e1;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
            border-bottom: 1px solid rgba(0, 212, 255, 0.3);
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 212, 255, 0.05),
                rgba(0, 212, 255, 0.05) 1px,
                transparent 1px,
                transparent 20px
            );
            animation: backgroundMove 20s linear infinite;
        }

        @keyframes backgroundMove {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 3px solid #00d4ff;
            margin: 0 auto 20px;
            background: linear-gradient(45deg, #00d4ff, #ff006e);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
            position: relative;
            z-index: 2;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-img:hover {
            transform: scale(1.1) rotate(5deg);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
        }

        .profile-img img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            transition: all 0.3s ease;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            position: relative;
            z-index: 2;
            background: linear-gradient(45deg, #00d4ff, #ff006e);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
            position: relative;
            z-index: 2;
            color: #b0b0b0;
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 40px;
            padding: 40px;
        }

        .sidebar {
            space-y: 30px;
        }

        .section {
            background: rgba(15, 15, 35, 0.8);
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 212, 255, 0.1);
            margin-bottom: 25px;
            transform: translateX(-20px);
            opacity: 0;
            animation: slideInLeft 0.6s ease-out forwards;
            transition: all 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 35px rgba(0, 212, 255, 0.2);
            border-color: rgba(0, 212, 255, 0.3);
        }

        .section:nth-child(2) { animation-delay: 0.2s; }
        .section:nth-child(3) { animation-delay: 0.4s; }
        .section:nth-child(4) { animation-delay: 0.6s; }

        @keyframes slideInLeft {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .content {
            space-y: 30px;
        }

        .content .section {
            transform: translateX(20px);
            animation: slideInRight 0.6s ease-out forwards;
        }

        @keyframes slideInRight {
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .section h2 {
            color: #00d4ff;
            margin-bottom: 20px;
            font-size: 1.4em;
            border-bottom: 2px solid #00d4ff;
            padding-bottom: 10px;
            position: relative;
        }

        .section h2::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 30px;
            height: 2px;
            background: #ff006e;
            animation: expandLine 0.8s ease-out;
        }

        @keyframes expandLine {
            from { width: 0; }
            to { width: 30px; }
        }

        .contact-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            transition: all 0.3s ease;
            color: #b0b0b0;
        }

        .contact-item:hover {
            background: rgba(0, 212, 255, 0.1);
            color: #00d4ff;
        }

        .contact-icon {
            width: 20px;
            height: 20px;
            margin-right: 15px;
            background: linear-gradient(45deg, #00d4ff, #ff006e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
        }

        .skill-item {
            margin-bottom: 20px;
        }

        .skill-name {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 600;
            color: #e1e1e1;
        }

        .skill-bar {
            height: 8px;
            background: rgba(15, 15, 35, 0.8);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .skill-progress {
            height: 100%;
            background: linear-gradient(90deg, #00d4ff, #ff006e);
            border-radius: 4px;
            width: 0;
            animation: fillSkill 1.5s ease-out forwards;
            position: relative;
        }

        .skill-progress::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes fillSkill {
            to { width: var(--skill-width); }
        }

        @keyframes shimmer {
            0%, 100% { transform: translateX(-100%); }
            50% { transform: translateX(100%); }
        }

        .experience-item, .education-item {
            padding: 20px;
            border-left: 3px solid #00d4ff;
            margin-bottom: 25px;
            background: rgba(0, 212, 255, 0.05);
            border-radius: 0 10px 10px 0;
            position: relative;
            transition: all 0.3s ease;
        }

        .experience-item:hover, .education-item:hover {
            background: rgba(0, 212, 255, 0.1);
            border-left-color: #ff006e;
            transform: translateX(5px);
        }

        .experience-item::before, .education-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 25px;
            width: 12px;
            height: 12px;
            background: #00d4ff;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .experience-item:hover::before, .education-item:hover::before {
            background: #ff006e;
            transform: scale(1.3);
            box-shadow: 0 0 15px rgba(255, 0, 110, 0.5);
        }

        .job-title {
            font-weight: bold;
            color: #00d4ff;
            font-size: 1.1em;
        }

        .company {
            color: #b0b0b0;
            font-style: italic;
        }

        .date {
            color: #808080;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .toggle-btn {
            background: linear-gradient(135deg, #00d4ff, #ff006e);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        .toggle-btn:hover {
            background: linear-gradient(135deg, #0099cc, #cc0055);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        }

        .hidden-content {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease;
        }

        .hidden-content.show {
            max-height: 500px;
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
                gap: 20px;
                padding: 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .profile-img {
                width: 120px;
                height: 120px;
                font-size: 36px;
            }

            .light-mode .language-switcher {
                position: relative;
                top: 0;
                right: 0;
                justify-content: center;
                margin-bottom: 20px;
            }

            .light-mode .top-controls {
                position: relative;
                top: 0;
                right: 0;
                justify-content: center;
                margin-bottom: 20px;
            }
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-element {
            position: absolute;
            background: linear-gradient(45deg, rgba(0, 212, 255, 0.1), rgba(255, 0, 110, 0.1));
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        .floating-element:nth-child(1) {
            width: 80px;
            height: 80px;
            top: 10%;
            left: 10%;
            animation-delay: 0s;
        }

        .floating-element:nth-child(2) {
            width: 120px;
            height: 120px;
            top: 70%;
            right: 10%;
            animation-delay: 2s;
        }

        .floating-element:nth-child(3) {
            width: 60px;
            height: 60px;
            top: 40%;
            left: 80%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { 
                transform: translateY(0) rotate(0deg);
                filter: blur(0px);
            }
            50% { 
                transform: translateY(-20px) rotate(180deg);
                filter: blur(1px);
            }
        }

        /* =================== LIGHT MODE STYLES =================== */
        body.light-mode {
            color: #333;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 50%, #dee2e6 100%);
        }

        .light-mode .cv-card {
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(0, 123, 255, 0.2);
        }

        .light-mode .header {
            background: linear-gradient(135deg, #ffffff, #f8f9fa);
            color: #333;
            border-bottom: 1px solid rgba(0, 123, 255, 0.3);
        }

        .light-mode .header::before {
            background: repeating-linear-gradient(
                45deg,
                rgba(0, 123, 255, 0.05),
                rgba(0, 123, 255, 0.05) 1px,
                transparent 1px,
                transparent 20px
            );
        }

        .light-mode .profile-img {
            border: 3px solid #007bff;
            background: linear-gradient(45deg, #007bff, #dc3545);
        }

        .light-mode .header h1 {
            background: linear-gradient(45deg, #007bff, #dc3545);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .light-mode .header p {
            color: #6c757d;
        }

        .light-mode .section {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 123, 255, 0.15);
            color: #333;
        }

        .light-mode .section:hover {
            box-shadow: 0 10px 35px rgba(0, 123, 255, 0.2);
            border-color: rgba(0, 123, 255, 0.3);
        }

        .light-mode .section h2 {
            color: #007bff;
            border-bottom-color: #007bff;
        }

        .light-mode .section h2::after {
            background: #dc3545;
        }

        .light-mode .contact-item {
            color: #6c757d;
        }

        .light-mode .contact-item:hover {
            background: rgba(0, 123, 255, 0.1);
            color: #007bff;
        }

        .light-mode .contact-icon {
            background: linear-gradient(45deg, #007bff, #dc3545);
        }

        .light-mode .skill-name {
            color: #333;
        }

        .light-mode .skill-bar {
            background: rgba(248, 249, 250, 0.8);
            border: 1px solid rgba(0, 123, 255, 0.2);
        }

        .light-mode .skill-progress {
            background: linear-gradient(90deg, #007bff, #dc3545);
        }

        .light-mode .experience-item,
        .light-mode .education-item {
            background: rgba(0, 123, 255, 0.05);
            border-left-color: #007bff;
        }

        .light-mode .experience-item:hover,
        .light-mode .education-item:hover {
            background: rgba(0, 123, 255, 0.1);
            border-left-color: #dc3545;
        }

        .light-mode .experience-item::before,
        .light-mode .education-item::before {
            background: #007bff;
        }

        .light-mode .experience-item:hover::before,
        .light-mode .education-item:hover::before {
            background: #dc3545;
            box-shadow: 0 0 15px rgba(220, 53, 69, 0.5);
        }

        .light-mode .job-title {
            color: #007bff;
        }

        .light-mode .company {
            color: #6c757d;
        }

        .light-mode .date {
            color: #adb5bd;
        }

        .light-mode .toggle-btn {
            background: linear-gradient(135deg, #007bff, #dc3545);
        }

        .light-mode .toggle-btn:hover {
            background: linear-gradient(135deg, #0056b3, #c82333);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.3);
        }

        .light-mode .lang-btn,
        .light-mode .skill-tag,
        .light-mode .theme-toggle {
            background: rgba(255, 255, 255, 0.9);
            color: #007bff;
            border-color: #007bff;
        }

        .light-mode .lang-btn:hover,
        .light-mode .skill-tag:hover,
        .light-mode .theme-toggle:hover {
            background: #007bff;
            color: white;
        }

        .light-mode .lang-btn.active {
            background: #007bff;
            color: white;
        }

        .light-mode .floating-element {
            background: linear-gradient(45deg, rgba(0, 123, 255, 0.1), rgba(220, 53, 69, 0.1));
        }

        .light-mode ::-webkit-scrollbar-track {
            background: #f8f9fa;
        }

        .light-mode ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #007bff, #dc3545);
        }

        .light-mode ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #0056b3, #c82333);
        }
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1a1a2e;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(45deg, #00d4ff, #ff006e);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: linear-gradient(45deg, #0099cc, #cc0055);
        }
    </style>
</head>

        // =================== LANGUAGE SWITCHING ===================
        function switchLanguage(lang) {
            currentLang = lang;
            
            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.lang === lang) {
                    btn.classList.add('active');
                }
            });
            
            // Update document language
            document.documentElement.lang = lang;
            
            // Re-render all content
            renderAllContent();
            
            // Re-initialize skill animations
            setTimeout(() => {
                animateSkills();
            }, 100);
        }

        // Add event listeners to language buttons
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                switchLanguage(btn.dataset.lang);
            });
        });

        // =================== UTILITY FUNCTIONS ===================
        
        // Animate skill bars on scroll
        function animateSkills() {
            const skillBars = document.querySelectorAll('.skill-progress');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.style.animationPlayState = 'running';
                    }
                });
            });

            skillBars.forEach(bar => {
                bar.style.animationPlayState = 'paused';
                observer.observe(bar);
            });
        }

        // Toggle content visibility
        function toggleContent(id) {
            const content = document.getElementById(id);
            const btn = content.previousElementSibling;
            
            if (content.classList.contains('show')) {
                content.classList.remove('show');
                if (id.includes('about')) {
                    btn.textContent = getText(cvData.buttons.showMore);
                } else {
                    btn.textContent = getText(cvData.buttons.details);
                }
            } else {
                content.classList.add('show');
                if (id.includes('about')) {
                    btn.textContent = getText(cvData.buttons.showLess);
                } else {
                    btn.textContent = getText(cvData.buttons.hideDetails);
                }
            }
        }

        function gotoLink(url) {
            console.log(`https://${url}`);
            window.open(`https://${url}`, '_blank');
        }

        // =================== THEME MANAGEMENT ===================
        let currentTheme = 'dark'; // default theme

        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('theme-icon');
            
            if (currentTheme === 'dark') {
                body.classList.add('light-mode');
                themeIcon.textContent = '☀️';
                currentTheme = 'light';
            } else {
                body.classList.remove('light-mode');
                themeIcon.textContent = '🌙';
                currentTheme = 'dark';
            }
            
            // Save theme preference
            localStorage.setItem('cv-theme', currentTheme);
            
            // Re-initialize animations after theme change
            setTimeout(() => {
                animateSkills();
            }, 100);
        }

        function loadThemePreference() {
            const savedTheme = localStorage.getItem('cv-theme');
            if (savedTheme && savedTheme !== currentTheme) {
                toggleTheme();
            }
        }

                ['#8b5cf6', '#06ffa5'],
                ['#06ffa5', '#ffbe0b'],
                ['#ffbe0b', '#fb5607'],
                ['#fb5607', '#ff006e'],
                ['#00d4ff', '#8b5cf6']
            ],
            light: [
                ['#007bff', '#dc3545'],
                ['#dc3545', '#6f42c1'],
                ['#6f42c1', '#20c997'],
                ['#20c997', '#ffc107'],
                ['#ffc107', '#fd7e14'],
                ['#fd7e14', '#dc3545'],
                ['#007bff', '#6f42c1']
            ]
        };

        function changeProfileColor() {
            currentColorIndex = (currentColorIndex + 1) % colorPalettes[currentTheme].length;
            const profileImg = document.querySelector('.profile-img');
            const colorPair = colorPalettes[currentTheme][currentColorIndex];
            profileImg.style.background = `linear-gradient(45deg, ${colorPair[0]}, ${colorPair[1]})`;
            profileImg.style.borderColor = colorPair[0];
        }

        // Smooth scrolling for better UX
        function smoothScroll() {
            document.documentElement.style.scrollBehavior = 'smooth';
        }

        // Add parallax effect to floating elements
        function addParallax() {
            window.addEventListener('scroll', () => {
                const scrolled = window.pageYOffset;
                const parallax = document.querySelectorAll('.floating-element');
                
                parallax.forEach((element, index) => {
                    const speed = 0.5 + (index * 0.1);
                    element.style.transform = `translateY(${scrolled * speed}px)`;
                });
            });
        }

        // Add keyboard navigation for language switching and theme toggle
        document.addEventListener('keydown', (e) => {
            if (e.ctrlKey || e.metaKey) {
                switch(e.key) {
                    case '1':
                        e.preventDefault();
                        switchLanguage('vi');
                        break;
                    case '2':
                        e.preventDefault();
                        switchLanguage('ja');
                        break;
                    case '3':
                        e.preventDefault();
                        switchLanguage('en');
                        break;
                    case 't':
                    case 'T':
                        e.preventDefault();
                        toggleTheme();
                        break;
                }
            }
        });

        // =================== INITIALIZATION ===================
        document.addEventListener('DOMContentLoaded', function() {
            // Load theme preference first
            loadThemePreference();
            
            // Initial render
            renderAllContent();
            
            // Initialize animations and effects
            animateSkills();
            smoothScroll();
            addParallax();
            
            // Add random movement to floating elements
            const floatingElements = document.querySelectorAll('.floating-element');
            floatingElements.forEach((element, index) => {
                setInterval(() => {
                    const randomX = Math.random() * 20 - 10;
                    const randomY = Math.random() * 20 - 10;
                    element.style.transform += ` translate(${randomX}px, ${randomY}px)`;
                }, 3000 + (index * 1000));
            });

            // Add click effect to sections
            document.querySelectorAll('.section').forEach(section => {
                section.addEventListener('click', function(e) {
                    if (e.target.tagName !== 'BUTTON') {
                        this.style.transform = 'scale(0.98)';
                        setTimeout(() => {
                            this.style.transform = '';
                        }, 150);
                    }
                });
            });

            // Add glowing effect on hover for interactive elements
            document.addEventListener('mouseover', function(e) {
                if (e.target.matches('.toggle-btn, .lang-btn, .profile-img, .theme-toggle')) {
                    const glowColor = currentTheme === 'dark' ? 'rgba(0, 212, 255, 0.6)' : 'rgba(0, 123, 255, 0.6)';
                    e.target.style.filter = `drop-shadow(0 0 10px ${glowColor})`;
                }
            });
            
            document.addEventListener('mouseout', function(e) {
                if (e.target.matches('.toggle-btn, .lang-btn, .profile-img, .theme-toggle')) {
                    e.target.style.filter = '';
                }
            });

            // Easter egg functionality
            let clickCount = 0;
            document.querySelector('.profile-img').addEventListener('click', function() {
                clickCount++;
                if (clickCount === 5) {
                    alert(getText(cvData.easterEgg));
                    clickCount = 0;
                }
            });
        });

        // =================== DATA MANAGEMENT HELPER FUNCTIONS ===================
        
        // Function to add new skill
        function addSkill(name, level) {
            cvData.skills.push({ name, level });
            renderSkills();
            animateSkills();
        }

        // Function to update skill level
        function updateSkill(skillName, newLevel) {
            const skill = cvData.skills.find(s => s.name === skillName);
            if (skill) {
                skill.level = newLevel;
                renderSkills();
                animateSkills();
            }
        }

        // Function to add new experience
        function addExperience(experienceData) {
            cvData.experience.unshift(experienceData); // Add to beginning
            renderExperience();
        }

        // Function to add new project
        function addProject(projectData) {
            cvData.projects.unshift(projectData); // Add to beginning
            renderProjects();
        }

        // Function to update contact information
        function updateContactInfo(index, newValue) {
            if (cvData.contact[index]) {
                cvData.contact[index].value = newValue;
                renderContact();
            }
        }

        // Function to update about section
        function updateAbout(newMain, newExtended) {
            cvData.about.main = newMain;
            cvData.about.extended = newExtended;
            renderAbout();
        }

        // Export functions for external use
        window.cvManager = {
            addSkill,
            updateSkill,
            addExperience,
            addProject,
            updateContactInfo,
            updateAbout,
            switchLanguage,
            toggleTheme,
            getCurrentLanguage: () => currentLang,
            getCurrentTheme: () => currentTheme,
            getData: () => cvData
        };
    </script>
</body>
</html>
