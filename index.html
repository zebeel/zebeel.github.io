<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LE VAN CHUONG</title>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="top-controls collapsed">
        <div class="language-switcher">
            <button class="lang-btn active" data-lang="vi">🇻🇳</button>
            <button class="lang-btn" data-lang="ja">🇯🇵</button>
            <button class="lang-btn" data-lang="en">🇬🇧</button>
        </div>
        <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Dark/Light Mode">
            <span id="theme-icon">🌙</span>
        </button>
        <button class="settings-toggle" onclick="toggleTopControls()" title="Show/Hide Controls">⚙️</button>
    </div>

    <div class="floating-elements">
        <div class="floating-element"></div>
        <div class="floating-element"></div>
        <div class="floating-element"></div>
    </div>

    <div class="container">
        <div class="cv-card">
            <div class="header">
                <div class="profile-img" onclick="changeProfileColor()"><img src="assets/images/profile-image.png" alt=""></div>
                <h1 id="full-name"></h1>
                <p id="job-title"></p>
            </div>

            <div class="main-content">
                <div class="sidebar">
                    <!-- Contact Section -->
                    <div class="section">
                        <h2 id="contact-title"></h2>
                        <div id="contact-content"></div>
                    </div>

                    <!-- Skills Section -->
                    <div class="section">
                        <h2 id="skills-title"></h2>
                        <div id="skills-content"></div>
                    </div>

                    <!-- Languages Section -->
                    <div class="section">
                        <h2 id="languages-title"></h2>
                        <div id="languages-content"></div>
                    </div>
                </div>

                <div class="content">
                    <!-- About Section -->
                    <div class="section">
                        <h2 id="about-title"></h2>
                        <div id="about-content"></div>
                    </div>

                    <!-- Experience Section -->
                    <div class="section">
                        <h2 id="experience-title"></h2>
                        <div id="experience-content"></div>
                    </div>

                    <!-- Education Section -->
                    <div class="section">
                        <h2 id="education-title"></h2>
                        <div id="education-content"></div>
                    </div>

                    <!-- Projects Section -->
                    <div class="section">
                        <h2 id="projects-title"></h2>
                        <div id="projects-content"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="assets/js/main.js"></script>

</body>
</html>
